spring.application.name=gym-backend

spring.datasource.url=jdbc:h2:file:./database/data;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Demo seed: when DB is fresh and gym.seed.demo=true, populate the H2
# database with full mock data (extra staff, 22 customers, 6 charge
# profiles, 12 machines, maintenance/repair history, subscriptions).
# Set to false for a clean prod-like environment with admin user only.
gym.seed.demo=true
